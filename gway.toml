[project]
name = "epaper"
aliases = ["gway-epaper"]

[adapter]
type = "python"
module = "gway_epaper.commands.main"

[lifecycle]
install = "gway_epaper.lifecycle:install"
upgrade = "gway_epaper.lifecycle:upgrade"

[service]
description = "GWAY e-paper display service"
command = ["{python}", "-m", "gway_epaper.service", "{project}/epaper.toml"]
restart = "on-failure"
restart_sec = 5
