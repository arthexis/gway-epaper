[display]
# Use "text" for development/CI or "waveshare_2in13_v4" for the
# Waveshare 2.13-inch e-Paper HAT V4 (250x122 monochrome).
driver = "text"
width = 40
lines = 12
# Runtime/source poll cadence. Hardware refreshes are independently guarded by
# min_refresh_seconds and unchanged frames are never sent to the panel.
refresh_seconds = 2.0
min_refresh_seconds = 5.0
font_size = 12
margin = 4

[printer]
prefix_source = true
timestamp = false

[[sources]]
name = "arthexis-log"
type = "file"
path = "/var/log/arthexis/charger.gway-001.log"
start = "end"
cursor_file = "/var/lib/gway-epaper/arthexis-log.cursor"
max_bytes = 65536
poll_seconds = 0.5

[[sources]]
name = "auth-events"
type = "redis"
url = "redis://localhost:6379/0"
stream = "arthexis:events"
event_types = ["ocpp.authorization"]
start = "$"
batch_size = 100
block_ms = 1000
cursor_file = "/var/lib/gway-epaper/auth.cursor"
