[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-epaper"
version = "0.1.0"
description = "Continuous multi-source printout service for Gway ePaper displays"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Rafael J. Guillén-Osorio" },
]
dependencies = [
  "waveshare-epd @ git+https://github.com/waveshareteam/e-Paper.git@a794fbc39656b0f93938d1ffb3fdc77eaed9e9fc#subdirectory=RaspberryPi_JetsonNano/python ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')",
  "spidev>=3.6 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')",
  "gpiozero>=2 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')",
  "lgpio>=0.2.2.0 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')",
]

[project.optional-dependencies]
redis = ["redis>=6,<9"]
epaper = ["Pillow>=10"]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
