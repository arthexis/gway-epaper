[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-epaper"
version = "0.1.0"
description = "Continuous multi-source printout service for Gway ePaper displays"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Rafael J. Guillén-Osorio" },
]
dependencies = [
  "tomli>=2; python_version < '3.11'",
  "kombu[redis]>=5.3,<6",
  "Pillow>=10 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')",
  "spidev>=3.6 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')",
  "gpiozero>=2 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')",
  "lgpio>=0.2.2.0 ; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l')",
]

[project.optional-dependencies]
redis = ["redis>=6,<9"]
celery = ["kombu[redis]>=5.3,<6"]
epaper = ["Pillow>=10"]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
