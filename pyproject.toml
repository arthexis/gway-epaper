[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-epaper"
version = "0.1.0"
description = "Continuous multi-source printout service for Gway ePaper displays"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Rafael J. Guillén-Osorio" },
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=6,<9"]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
